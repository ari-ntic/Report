<!DOCTYPE html>
<html>
<head>
  <script src="config.js?v=4"></script>
  <script src="auth.js?v=4"></script>
  <script src="rpc.js?v=4"></script>
  <base target="_top">
  <style>
    :root {
      --primary: #2563eb;
      --danger: #dc2626;
      --bg: #f8fafc;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 16px; margin: 0; background: var(--bg); color: #0f172a; font-size: 13px; }
    
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      gap: 8px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 10px; }
    
    button {
      padding: 7px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-scan { background: var(--primary); color: white; }
    .btn-delete-selected { background: #d97706; color: white; }
    .btn-delete-all { background: var(--danger); color: white; }

    .grid-container {
      max-height: 400px;
      overflow-y: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .orphan-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      background: #fafafa;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .orphan-card.selected { border-color: var(--danger); background: #fef2f2; }
    
    .orphan-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      border-radius: 4px;
      background: #e2e8f0;
    }

    .checkbox-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      transform: scale(1.3);
      cursor: pointer;
      z-index: 2;
    }

    .photo-info {
      font-size: 10px;
      color: #64748b;
      margin-top: 6px;
      word-break: break-all;
      line-height: 1.2;
    }

    .status-box {
      text-align: center;
      padding: 40px 10px;
      color: #64748b;
      grid-column: 1 / -1;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn-scan" onclick="runScan()">🔍 Scan Foto Orphan</button>
      <label style="cursor:pointer; display:flex; align-items:center; gap:4px;">
        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" disabled>
        <b>Pilih Semua</b>
      </label>
    </div>
    <div>
      <button class="btn-delete-selected" id="btnDeleteSelected" onclick="deleteSelected()" disabled>🗑️ Hapus Terpilih (0)</button>
      <button class="btn-delete-all" id="btnDeleteAll" onclick="deleteAll()" disabled>🔥 Hapus SEMUA</button>
    </div>
  </div>

  <div class="grid-container" id="gridContainer">
    <div class="status-box">Klik <b>"Scan Foto Orphan"</b> untuk memeriksa foto yang tidak terdaftar di Spreadsheet.</div>
  </div>

  <script>
    let orphanPhotos = [];

    function runScan() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '<div class="status-box"><span class="spinner"></span> Memeriksa Google Drive vs Spreadsheet... Mohon tunggu.</div>';
      
      setButtonsState(true, 0);
      document.getElementById('selectAllCheckbox').checked = false;
      document.getElementById('selectAllCheckbox').disabled = true;

      google.script.run
        .withSuccessHandler(renderGrid)
        .withFailureHandler(err => {
          container.innerHTML = `<div class="status-box" style="color:red;">Error: ${err.message}</div>`;
        })
        .scanOrphanPhotos();
    }

    function renderGrid(list) {
      orphanPhotos = list || [];
      const container = document.getElementById('gridContainer');

      if (orphanPhotos.length === 0) {
        container.innerHTML = '<div class="status-box" style="color:#16a34a;">✅ Tidak ditemukan foto orphan. Semua foto di Drive terdaftar rapi di Spreadsheet!</div>';
        setButtonsState(true, 0);
        return;
      }

      document.getElementById('selectAllCheckbox').disabled = false;

      container.innerHTML = orphanPhotos.map((item, idx) => `
        <div class="orphan-card" id="card_${idx}">
          <input type="checkbox" class="checkbox-badge item-check" value="${item.id}" onchange="updateSelectionUI()">
          <img src="${item.url}" loading="lazy" alt="Orphan Photo">
          <div class="photo-info">
            <b>${escapeHtml(item.name)}</b><br>
            ${item.size} • ${item.created}
          </div>
        </div>
      `).join('');

      updateSelectionUI();
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.item-check');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const checkboxes = document.querySelectorAll('.item-check');
      let selectedCount = 0;

      checkboxes.forEach((cb, idx) => {
        const card = document.getElementById(`card_${idx}`);
        if (cb.checked) {
          selectedCount++;
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });

      const btnSelected = document.getElementById('btnDeleteSelected');
      const btnAll = document.getElementById('btnDeleteAll');

      btnSelected.innerText = `🗑️ Hapus Terpilih (${selectedCount})`;
      btnSelected.disabled = selectedCount === 0;
      btnAll.disabled = orphanPhotos.length === 0;
    }

    function setButtonsState(disabled, count = 0) {
      document.getElementById('btnDeleteSelected').disabled = disabled || count === 0;
      document.getElementById('btnDeleteAll').disabled = disabled || orphanPhotos.length === 0;
    }

    function deleteSelected() {
      const selectedIds = Array.from(document.querySelectorAll('.item-check:checked')).map(cb => cb.value);
      if (selectedIds.length === 0) return;

      if (confirm(`Apakah Anda yakin ingin menghapus ${selectedIds.length} foto terpilih ke Sampah Google Drive?`)) {
        executeDelete(selectedIds);
      }
    }

    function deleteAll() {
      if (orphanPhotos.length === 0) return;
      const allIds = orphanPhotos.map(p => p.id);

      if (confirm(`⚠️ PERINGATAN BANYAK!\n\nApakah Anda yakin ingin menghapus SEMUA ${allIds.length} foto orphan ini?`)) {
        executeDelete(allIds);
      }
    }

    function executeDelete(ids) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = `<div class="status-box"><span class="spinner"></span> Menghapus ${ids.length} foto dari Google Drive...</div>`;

      google.script.run
        .withSuccessHandler(res => {
          alert(`✅ Berhasil menghapus ${res.deletedCount} foto ke Sampah Google Drive.`);
          runScan(); // Re-scan otomatis
        })
        .withFailureHandler(err => {
          alert(`❌ Gagal menghapus foto: ${err.message}`);
          runScan();
        })
        .deleteSelectedOrphanPhotos(ids);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
